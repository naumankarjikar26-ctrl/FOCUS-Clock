<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="focus">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Focus Tracker</title>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <style>
        :root {
            --bg-color: #fdfdfd;
            --text-main: #111;
            --text-muted: #999;
            --card-bg: #fff;
            --btn-dark: #222;
            --btn-light: #f0f0f0;
            --btn-text: #fff;
            --border: var(--border);
            --input-bg: #fafafa;
            --input-border: #ddd;
            --hover: #e5e5e5;
            --cell-lvl-1: #d0d0d0;
            color-scheme: light;
        }

        body.dark {
            --bg-color: #121212;
            --text-main: #eee;
            --text-muted: #888;
            --card-bg: #1c1c1c;
            --btn-dark: #eee;
            --btn-light: #2a2a2a;
            --btn-text: #111;
            --border: #2e2e2e;
            --input-bg: #1a1a1a;
            --input-border: #333;
            --hover: #383838;
            --cell-lvl-1: #4a4a4a;
            color-scheme: dark;
        }

        input, select, button { color: var(--text-main); }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 130px 0 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Top Left Logo */
        .top-left { position: absolute; top: 40px; left: 40px; }
        .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

        /* Top Right Quote Box */
        .quote-box {
            position: absolute; top: 40px; right: 40px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            text-align: center;
            cursor: text;
            z-index: 10;
        }
        .quote-text { font-size: 1rem; font-weight: 700; outline: none; }

        /* Center Content Container */
        .center-wrapper { display: flex; flex-direction: column; align-items: center; position: relative; width: 100%; }
        
        /* Focus Title text */
        .focus-title { font-size: 1.2rem; font-weight: 700; letter-spacing: 1px; outline: none; text-align: center; position: relative; z-index: 10; padding: 5px 15px; margin-bottom: 5px; display: block; }
        
        /* Timer Layout */
        .time-display { font-size: 12vw; font-weight: 800; letter-spacing: -2px; display: flex; align-items: center; justify-content: center; line-height: 0.9; margin: 0 0 30px 0; position: relative; z-index: 5; }
        .time-part { outline: none; min-width: 1.2em; text-align: center; display: inline-block; line-height: 0.9; }
        .time-part:focus { caret-color: var(--text-muted); }
        .colon { display: inline-block; line-height: 0.9; pointer-events: none; user-select: none; }

        /* Controls */
        .controls { display: flex; gap: 15px; align-items: center; height: 54px; }
        .btn-primary { background: var(--btn-dark); color: var(--btn-text); border: none; border-radius: 30px; padding: 18px 40px; font-size: 1rem; font-weight: 600; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-icon { background: var(--btn-light); color: var(--text-main); border: none; border-radius: 50%; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: background 0.2s; }
        .btn-icon:hover { background: var(--hover); }

        /* Alarm Interface */
        #alarm-interface { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 420px; z-index: 10; margin-top: 10px; }
        .alarm-list { width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 40vh; overflow-y: auto; margin-bottom: 15px; padding: 5px; }
        .alarm-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.03); font-weight: 600; transition: background 0.2s; }
        .alarm-item.inactive { opacity: 0.6; }
        .alarm-info { display: flex; flex-direction: column; text-align: left; }
        .alarm-label { font-size: 0.8rem; color: var(--text-muted); font-weight: normal; margin-top: 2px; }
        .alarm-controls { display: flex; gap: 10px; align-items: center; }
        .toggle-btn { border: none; padding: 6px 12px; border-radius: 15px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .toggle-btn.on { background: var(--btn-dark); color: var(--btn-text); }
        .toggle-btn.off { background: var(--btn-light); color: var(--text-muted); }
        .alarm-btn.delete { background: none; border: none; cursor: pointer; font-size: 1.3rem; color: #d9534f; padding: 0; line-height: 1; }
        .add-alarm-form { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; max-width: 320px; background: var(--card-bg); padding: 15px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.04); justify-content: center; }
        .add-alarm-form input { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.9rem; font-family: inherit; background: var(--input-bg); }
        .add-alarm-form input[type="time"] { width: 110px; }
        .add-alarm-form input[type="text"] { flex: 1; min-width: 120px; }
        .alarm-action-btns { display: flex; gap: 8px; width: 100%; }
        .alarm-action-btns button { flex: 1; color: #fff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.9rem; }
        .btn-add { background: var(--btn-dark); }
        .btn-test { background: #666; }

        /* Study Mode Interface */
        #study-interface { display: none; flex-direction: column; align-items: center; width: 100%; z-index: 10; margin-top: 10px; }
        
        .study-nav { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 350px; justify-content: center; }
        .study-nav-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: var(--btn-light); color: var(--text-muted); transition: all 0.2s; }
        .study-nav-btn.active { background: var(--btn-dark); color: var(--btn-text); }

        .preset-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; width: 100%; max-width: 300px; }
        .preset-btn { background: var(--card-bg); color: var(--text-main); border: 2px solid var(--border); padding: 15px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.9rem; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;}
        .preset-btn:hover { border-color: var(--btn-dark); transform: translateY(-2px); }
        .preset-delete { background: none; border: none; color: #d9534f; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }

        .custom-preset-form { display: flex; gap: 8px; width: 100%; margin-top: 5px; }
        .custom-preset-form input { flex: 1; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.9rem; background: var(--input-bg); }
        .custom-preset-form button { background: var(--btn-dark); color: var(--btn-text); border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; }

        /* Stats Graph & Calendar */
        #study-stats-view { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 360px; }
        
        .stats-header { font-size: 0.9rem; font-weight: 800; margin-bottom: 5px; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; width: 100%; text-align: left; }
        
        .graph-container { display: flex; align-items: flex-end; justify-content: space-around; height: 130px; width: 100%; margin-top: 15px; padding-bottom: 20px; border-bottom: 1px solid var(--border); position: relative; }
        .bar-group { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 40px; position: relative; }
        .bar { width: 100%; background: var(--btn-dark); border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.5s ease-out; }
        .bar-label { font-size: 0.65rem; color: var(--text-muted); position: absolute; bottom: -18px; font-weight: 600; }
        .stat-total { font-size: 0.65rem; font-weight: bold; position: absolute; top: -18px; }
        
        /* Subtle GitHub-style Calendar */
        .calendar-wrapper { width: 100%; margin-top: 20px; display: flex; flex-direction: column; gap: 5px; }
        .month-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .month-header .stats-header { width: auto; margin-bottom: 0; }
        .month-select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.8rem; font-family: inherit; font-weight: 600; background: var(--input-bg); color: var(--text-main); cursor: pointer; }
        .calendar-heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; margin-top: 10px; }
        .day-cell { height: 28px; border-radius: 6px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 600; color: var(--text-muted); transition: transform 0.1s; }
        .day-cell.empty { background: none; }
        .day-cell:hover { transform: scale(1.1); }
        .day-cell.lvl-1 { background: var(--cell-lvl-1); }
        .day-cell.lvl-2 { background: #999; color: #fff; }
        .day-cell.lvl-3 { background: var(--btn-dark); color: var(--btn-text); }

        /* Music Player Panel */
        #music-panel { position: absolute; bottom: 105px; left: 40px; background: var(--card-bg); padding: 15px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 300px; display: none; flex-direction: column; gap: 10px; z-index: 20; border: 1px solid var(--border); }
        .music-header { font-weight: 700; font-size: 1rem; margin: 0; display: flex; justify-content: space-between; align-items: center; }
        .close-music { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-muted); }
        .music-input-group { display: flex; gap: 5px; }
        .music-input-group input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.8rem; font-family: inherit; background: var(--input-bg); }
        .music-input-group button { background: var(--btn-dark); color: var(--btn-text); border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .loop-btn { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--text-muted); border-radius: 8px; padding: 2px 6px; }
        .loop-btn.active { color: var(--btn-text); background: var(--btn-dark); }
        
        /* Bottom Elements */
        .bottom-left { position: fixed; bottom: 40px; left: 40px; display: flex; gap: 10px; z-index: 20; }
        .bottom-right { position: fixed; bottom: 40px; right: 40px; display: flex; gap: 10px; z-index: 20; }
        .mode-selector { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--btn-light); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; outline: none; cursor: pointer; z-index: 30; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }

        #settings-panel { display: none; flex-direction: column; gap: 8px; position: fixed; bottom: 105px; right: 40px; background: var(--card-bg); padding: 15px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: 1px solid var(--border); z-index: 20; width: 220px; }
        .reorder-title { font-weight: 800; font-size: 0.75rem; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; }
        .reorder-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--btn-light); border-radius: 8px; font-weight: 600; font-size: 0.85rem; }
        .reorder-arrows button { background: none; border: none; cursor: pointer; font-size: 0.9rem; color: var(--text-main); padding: 2px 6px; }
        .reorder-arrows button:disabled { opacity: 0.25; cursor: default; }
        .reorder-title + .reorder-title, #reorder-list + .reorder-title { margin-top: 8px; }
        
        /* Ringing Overlay */
        .alarm-ringing { position: fixed; top: 20px; background: var(--btn-dark); color: var(--btn-text); padding: 15px 25px; border-radius: 30px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: slideDown 0.3s ease-out; z-index: 100; display: none; align-items: center; gap: 15px; }
        /* Planner Mode */
        #planner-interface { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 720px; z-index: 10; margin-top: 10px; }
        .day-strip { display: flex; gap: 8px; margin-bottom: 18px; }
        .day-btn { width: 52px; padding: 8px 0; border-radius: 10px; border: none; background: var(--btn-light); color: var(--text-muted); font-weight: 700; font-size: 0.8rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: all 0.2s; }
        .day-btn small { font-size: 0.65rem; font-weight: 600; }
        .day-btn.today { color: var(--text-main); }
        .day-btn.active { background: var(--btn-dark); color: var(--btn-text); }
        .plan-carousel { display: grid; width: 320px; max-width: 100%; margin: 10px auto 0; padding: 0 0 24px; touch-action: pan-y; }
        .plan-card { grid-area: 1 / 1; background: var(--card-bg); border: 2px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 10px; position: relative; transition: transform 0.35s ease, opacity 0.35s ease; transform-origin: 50% 100%; }
        .plan-card[data-pos="0"] { z-index: 3; }
        .plan-card[data-pos="1"] { z-index: 2; transform: translate(14px, 8px) rotate(4deg); background: var(--btn-light); border-color: var(--input-border); }
        .plan-card[data-pos="2"] { z-index: 1; transform: translate(-14px, 12px) rotate(-4deg); background: var(--btn-light); border-color: var(--input-border); }
        .plan-card[data-pos="hidden"] { z-index: 0; opacity: 0; transform: translateY(20px) scale(0.95); pointer-events: none; }
        .plan-card:not([data-pos="0"]) > * { visibility: hidden; }
        .plan-card:not([data-pos="0"]) { pointer-events: none; }
        .deck-nav { display: flex; align-items: center; gap: 14px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
        .deck-nav button { width: 36px; height: 36px; font-size: 1rem; }
        .plan-card.running { border-color: var(--btn-dark); }
        .plan-subject { font-size: 1.3rem; font-weight: 800; padding-right: 24px; overflow-wrap: anywhere; }
        .plan-item { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; min-height: 1em; overflow-wrap: anywhere; }
        .plan-progress { height: 8px; background: var(--btn-light); border-radius: 4px; overflow: hidden; }
        .plan-progress div { height: 100%; background: var(--btn-dark); border-radius: 4px; transition: width 0.5s; }
        .plan-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; font-weight: 700; }
        .plan-play { width: 40px; height: 40px; font-size: 0.95rem; }
        .plan-delete { position: absolute; top: 12px; right: 12px; background: none; border: none; color: #d9534f; font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
        .plan-empty { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; padding: 40px 0; text-align: center; width: 100%; }
        .plan-form { display: flex; gap: 8px; width: 100%; max-width: 560px; margin-top: 10px; }
        .plan-form input { flex: 1; min-width: 0; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.9rem; font-family: inherit; background: var(--input-bg); }
        .plan-form input#plan-hours { flex: 0 0 80px; }
        .plan-form button { background: var(--btn-dark); color: var(--btn-text); border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .plan-week { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; margin-top: 12px; letter-spacing: 0.5px; }
        .plan-note-last { font-size: 0.75rem; color: var(--text-muted); font-style: italic; overflow-wrap: anywhere; }
        .plan-note { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.8rem; font-family: inherit; background: var(--input-bg); }
        .plan-actions { display: flex; gap: 6px; }
        .plan-pomo { width: 40px; height: 40px; font-size: 0.95rem; }
        .pomo-choices { display: flex; flex-wrap: wrap; gap: 6px; }
        .pomo-choices button { border: none; background: var(--btn-light); padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        .pomo-choices button:hover { background: var(--btn-dark); color: var(--btn-text); }
        .streak-box { width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; padding: 16px; border-radius: 14px; background: var(--btn-light); }
        .streak-top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; }
        .streak-count { font-size: 1.1rem; }
        .streak-today { font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
        .streak-box .plan-progress { background: var(--card-bg); }
        .goal-input { width: 70px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.8rem; font-family: inherit; font-weight: 700; background: var(--input-bg); text-align: center; }
        .exam-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; max-width: 560px; }
        .exam-chip { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--btn-light); font-size: 0.8rem; font-weight: 700; }
        .exam-chip .days { color: var(--text-muted); }
        .exam-chip.soon .days { color: #d9534f; }
        .exam-chip button { background: none; border: none; color: #d9534f; cursor: pointer; font-size: 1rem; padding: 0; line-height: 1; }
        .exam-form { display: flex; gap: 6px; }
        .exam-form input { width: 110px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.8rem; font-family: inherit; background: var(--input-bg); }
        .exam-form input[type="date"] { width: 140px; }
        .exam-form button { background: var(--btn-dark); color: var(--btn-text); border: none; padding: 0 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .streak-extra { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }
        #distract-btn { display: none; position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 30; border: none; background: var(--btn-light); color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.08); transition: transform 0.1s; }
        #distract-btn:active { transform: translateX(-50%) scale(0.95); }
        .settings-btn { border: none; background: var(--btn-dark); color: var(--btn-text); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        .sync-box { display: flex; flex-direction: column; gap: 6px; }
        .sync-box input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--input-border); outline: none; font-size: 0.8rem; font-family: inherit; background: var(--input-bg); }
        .sync-btns { display: flex; gap: 6px; }
        .sync-btns .settings-btn { flex: 1; padding: 8px; }
        .sync-status { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; overflow-wrap: anywhere; }
        .subject-stats { width: 100%; margin-top: 20px; display: flex; flex-direction: column; gap: 6px; }
        .subject-row { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; padding: 8px 12px; background: var(--btn-light); border-radius: 8px; }

        .stop-alarm-btn { background: var(--btn-text); color: var(--btn-dark); border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; cursor: pointer; font-size: 0.85rem; transition: transform 0.1s; }
        .stop-alarm-btn:active { transform: scale(0.95); }
        @keyframes slideDown { from { top: -50px; opacity: 0; } to { top: 20px; opacity: 1; } }

    </style>
</head>
<body>

    <div class="alarm-ringing" id="alarm-ringing-box">
        <span id="alarm-ringing-text">ALARM: WAKE UP!</span>
        <button class="stop-alarm-btn" onclick="stopAlarm()">STOP</button>
    </div>

    <div class="top-left">
        <div class="logo">focus</div>
        <div class="subtitle">liquid glass</div>
    </div>

    <div class="quote-box">
        <div class="quote-text" contenteditable="true">"GET SHIT DONE!"</div>
    </div>

    <div class="center-wrapper">
        <div class="focus-title" id="focus-title" contenteditable="true">STUDY</div>
        
        <!-- Default Timer Display -->
        <div class="time-display" id="timer-display">
            <div class="time-part" id="t-hours" contenteditable="true">02</div><span class="colon">:</span><!--
            --><div class="time-part" id="t-minutes" contenteditable="true">00</div><span class="colon" style="display: none;">:</span><!--
            --><div class="time-part" id="t-seconds" contenteditable="true" style="display: none;">00</div>
        </div>

        <!-- Clock Display -->
        <div class="time-display" id="clock-display" style="display: none;">
            <div class="time-part" id="c-hours">12</div><span class="colon">:</span><!--
            --><div class="time-part" id="c-minutes">00</div><span class="colon">:</span><!--
            --><div class="time-part" id="c-seconds">00</div>
        </div>

        <!-- Study Preset Timer Display -->
        <div class="time-display" id="study-timer-display" style="display: none;">
            <div class="time-part" id="st-hours">00</div><span class="colon">:</span><!--
            --><div class="time-part" id="st-minutes">00</div><span class="colon">:</span><!--
            --><div class="time-part" id="st-seconds">00</div>
        </div>
        
        <!-- Controls -->
        <div class="controls" id="main-controls">
            <button class="btn-primary" id="toggle-btn" onclick="toggle()">Start</button>
            <button class="btn-icon" id="reset-btn" onclick="resetTime()">↻</button>
            <button class="btn-icon" id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>
        </div>

        <!-- Alarm Interface Tab -->
        <div id="alarm-interface">
            <div class="alarm-list" id="alarm-list"></div>
            <div class="add-alarm-form">
                <input type="time" id="new-alarm-time" required>
                <input type="text" id="new-alarm-label" placeholder="Alarm Label" maxlength="20">
                <div class="alarm-action-btns">
                    <button class="btn-add" onclick="addAlarm()">Add Alarm</button>
                    <button class="btn-test" onclick="triggerAlarm('TEST BEEP')">Test Beep</button>
                </div>
            </div>
        </div>

        <!-- Planner Interface Tab -->
        <div id="planner-interface">
            <div class="exam-row" id="exam-row"></div>
            <div class="day-strip" id="day-strip"></div>
            <div class="plan-carousel" id="plan-carousel"></div>
            <div class="deck-nav" id="deck-nav">
                <button class="btn-icon" onclick="flipDeck(-1)" title="Previous card">‹</button>
                <span id="deck-count"></span>
                <button class="btn-icon" onclick="flipDeck(1)" title="Next card">›</button>
            </div>
            <div class="plan-form">
                <input type="text" id="plan-subject" placeholder="Subject" maxlength="30">
                <input type="number" id="plan-hours" placeholder="Hours" min="0.25" step="0.25">
                <input type="text" id="plan-item" placeholder="Item (e.g. SAT Prep)" maxlength="40">
                <button onclick="addPlan()">+</button>
            </div>
            <div class="plan-week" id="plan-week"></div>
        </div>

        <!-- Study Interface Tab -->
        <div id="study-interface">
            
            <div class="study-nav" id="study-nav">
                <button class="study-nav-btn active" id="tab-btn-presets" onclick="switchStudyTab('presets')">Presets</button>
                <button class="study-nav-btn" id="tab-btn-stopwatch" onclick="switchStudyTab('stopwatch')">Stopwatch</button>
                <button class="study-nav-btn" id="tab-btn-stats" onclick="switchStudyTab('stats')">Stats</button>
            </div>

            <!-- Timer / Presets View -->
            <div id="study-main-view" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <div class="preset-btns" id="study-presets">
                    <div id="custom-presets-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
                    
                    <div class="custom-preset-form">
                        <input type="number" id="custom-s-in" placeholder="Study (m)" min="1">
                        <input type="number" id="custom-b-in" placeholder="Break (m)" min="1">
                        <button onclick="addCustomPreset()">+</button>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn-icon" id="study-pause-btn" onclick="toggleStudyPause()" style="display: none;">⏸</button>
                    <button class="btn-icon" id="study-cancel-btn" onclick="cancelStudy()" style="display: none;">⏹</button>
                </div>
            </div>

            <!-- Study Stopwatch View -->
            <div id="study-stopwatch-view" style="display: none; flex-direction: column; align-items: center; margin-top: 20px;">
                <div class="time-display" style="margin-bottom: 30px;">
                    <div class="time-part" id="ssw-hours">00</div><span class="colon">:</span><!--
                    --><div class="time-part" id="ssw-minutes">00</div><span class="colon">:</span><!--
                    --><div class="time-part" id="ssw-seconds">00</div>
                </div>
                <button class="btn-primary" id="ssw-toggle-btn" onclick="toggleStudyStopwatch()">Start</button>
            </div>

            <!-- Statistics / Graph View -->
            <div id="study-stats-view">
                <div class="streak-box">
                    <div class="streak-top">
                        <span class="streak-count" id="streak-count"></span>
                        <span class="streak-today" id="streak-today"></span>
                    </div>
                    <div class="plan-progress"><div id="streak-bar"></div></div>
                    <div class="streak-extra" id="distract-stats"></div>
                </div>
                <div class="stats-header">Past 7 Days</div>
                <div class="graph-container" id="stats-graph"></div>
                
                <div class="subject-stats">
                    <div class="stats-header">By Subject</div>
                    <div id="subject-stats"></div>
                </div>

                <div class="calendar-wrapper">
                    <div class="month-header">
                        <div class="stats-header">Monthly Activity</div>
                        <select class="month-select" id="month-select" onchange="renderCalendar()"></select>
                    </div>
                    <div class="calendar-heatmap" id="calendar-heatmap"></div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-left">
        <button class="btn-icon">🔔</button>
        <button class="btn-icon" onclick="toggleMusicPanel()">🎵</button>
        
        <div id="music-panel">
            <div class="music-header">
                Spotify Player
                <div class="header-btns">
                    <button class="loop-btn" id="loop-btn" onclick="toggleLoop()" title="Loop current track">🔁</button>
                    <button class="close-music" onclick="toggleMusicPanel()">×</button>
                </div>
            </div>
            <div id="spotify-embed-container" style="border-radius:12px; overflow:hidden;"></div>
            <div class="music-input-group">
                <input type="text" id="spotify-link" placeholder="Paste Spotify URL here...">
                <button onclick="loadSpotify()">Load</button>
            </div>
        </div>
    </div>

    <button id="distract-btn" onclick="logDistraction()">😵 Distracted</button>

    <select class="mode-selector" id="mode-select" onchange="changeMode()"></select>

    <div id="settings-panel">
        <div class="reorder-title">APPEARANCE</div>
        <div class="reorder-item">
            <span>Dark mode</span>
            <button class="toggle-btn off" id="dark-toggle" onclick="toggleDarkMode()">OFF</button>
        </div>
        <div class="reorder-item">
            <span>Notifications</span>
            <button class="toggle-btn off" id="notify-toggle" onclick="toggleNotifications()">OFF</button>
        </div>
        <div class="reorder-item">
            <span>Daily goal (hours)</span>
            <input type="number" class="goal-input" id="daily-goal" min="0.25" step="0.25" onchange="setDailyGoal(this.value)">
        </div>
        <div class="reorder-title">SYNC</div>
        <div class="sync-box" id="sync-box">
            <div class="sync-status">Sync is loading…</div>
        </div>
        <div class="reorder-title">BACKUP</div>
        <div class="reorder-item">
            <button class="settings-btn" onclick="exportData()">Export</button>
            <button class="settings-btn" onclick="document.getElementById('import-file').click()">Import</button>
            <input type="file" id="import-file" accept="application/json,.json" style="display: none;" onchange="importData(this)">
        </div>
        <div class="reorder-title">REORDER MODES</div>
        <div id="reorder-list"></div>
    </div>

    <div class="bottom-right">
        <button class="btn-icon" onclick="toggleSettingsPanel()" title="Settings">⚙️</button>
    </div>

    <script>
        let mode = 'timer';
        let timerRunning = false;
        
        // Study variables
        let studyState = 'idle'; 
        let currentStudySecs = 0;
        let pendingBreakMins = 0;
        let studyPaused = false;

        let isStudyStopwatchRunning = false;
        let studyStopwatchSecs = 0;
        
        // Load stored data
        let customPresets = JSON.parse(localStorage.getItem('focus_custom_presets')) || [];
        let studyStats = JSON.parse(localStorage.getItem('focus_study_stats')) || {}; 

        let plans = JSON.parse(localStorage.getItem('focus_planner')) || {};
        let subjectStats = JSON.parse(localStorage.getItem('focus_subject_stats')) || {};
        let selectedPlanDay = null;
        let activePlan = null; // { day, index }
        let pomodoroPlan = null; // planner card a study preset is counting toward
        let deckIndex = 0; // which planner card is on top of the stack
        let pomoChooser = null; // index of card showing preset choices
        let exams = JSON.parse(localStorage.getItem('focus_exams')) || [];
        let distractions = JSON.parse(localStorage.getItem('focus_distractions')) || {};
        let dailyGoal = parseFloat(localStorage.getItem('focus_daily_goal')) || 2;

        let alarms = [];
        let audioCtx;
        let activeAlarmInterval = null;
        
        const btn = document.getElementById('toggle-btn');
        const resetBtn = document.getElementById('reset-btn');
        const focusTitle = document.getElementById('focus-title');
        
        const timerDisplay = document.getElementById('timer-display');
        const clockDisplay = document.getElementById('clock-display');
        const studyTimerDisplay = document.getElementById('study-timer-display');

        const alarmInterface = document.getElementById('alarm-interface');
        const studyInterface = document.getElementById('study-interface');
        
        const studyMainView = document.getElementById('study-main-view');
        const studyStopwatchView = document.getElementById('study-stopwatch-view');
        const studyStatsView = document.getElementById('study-stats-view');
        const studyNav = document.getElementById('study-nav');
        
        const studyPresets = document.getElementById('study-presets');
        const studyCancelBtn = document.getElementById('study-cancel-btn');
        const studyPauseBtn = document.getElementById('study-pause-btn');
        const customPresetsContainer = document.getElementById('custom-presets-container');
        const statsGraph = document.getElementById('stats-graph');
        const calendarHeatmap = document.getElementById('calendar-heatmap');

        const plannerInterface = document.getElementById('planner-interface');
        const planCarousel = document.getElementById('plan-carousel');
        const alarmList = document.getElementById('alarm-list');
        const ringingBox = document.getElementById('alarm-ringing-box');
        const ringingText = document.getElementById('alarm-ringing-text');
        
        const musicPanel = document.getElementById('music-panel');

        // --- Mode order ---
        const modeLabels = { timer: 'Timer', clock: 'Clock', alarm: 'Alarm', study: 'Study', planner: 'Planner' };
        let modeOrder = (JSON.parse(localStorage.getItem('focus_mode_order')) || []).filter(m => modeLabels[m]);
        Object.keys(modeLabels).forEach(m => { if (!modeOrder.includes(m)) modeOrder.push(m); });

        function renderModeSelect() {
            const select = document.getElementById('mode-select');
            const current = select.value || mode;
            select.innerHTML = modeOrder.map(m => `<option value="${m}">${modeLabels[m]}</option>`).join('');
            select.value = modeOrder.includes(current) ? current : modeOrder[0];
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settings-panel');
            if (panel.style.display === 'flex') { panel.style.display = 'none'; return; }
            renderReorderList();
            document.getElementById('daily-goal').value = dailyGoal;
            panel.style.display = 'flex';
        }

        function applyDarkMode(on) {
            document.body.classList.toggle('dark', on);
            const toggle = document.getElementById('dark-toggle');
            toggle.className = on ? 'toggle-btn on' : 'toggle-btn off';
            toggle.innerText = on ? 'ON' : 'OFF';
        }

        function toggleDarkMode() {
            const on = !document.body.classList.contains('dark');
            localStorage.setItem('focus_dark_mode', on ? '1' : '0');
            applyDarkMode(on);
        }

        applyDarkMode(localStorage.getItem('focus_dark_mode') === '1');
        applyNotifyToggle();

        function renderReorderList() {
            const list = document.getElementById('reorder-list');
            list.innerHTML = modeOrder.map((m, i) => `
                <div class="reorder-item">
                    <span>${modeLabels[m]}</span>
                    <span class="reorder-arrows">
                        <button onclick="moveMode(${i}, -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
                        <button onclick="moveMode(${i}, 1)" ${i === modeOrder.length - 1 ? 'disabled' : ''}>↓</button>
                    </span>
                </div>
            `).join('');
        }

        function moveMode(index, dir) {
            const newIndex = index + dir;
            if (newIndex < 0 || newIndex >= modeOrder.length) return;
            [modeOrder[index], modeOrder[newIndex]] = [modeOrder[newIndex], modeOrder[index]];
            localStorage.setItem('focus_mode_order', JSON.stringify(modeOrder));
            renderReorderList();
            renderModeSelect();
        }

        renderModeSelect();

        // --- Spotify player (iFrame API, enables loop control) ---
        let spotifyController = null;
        let loopEnabled = false;
        let currentSpotifyUri = 'spotify:playlist:37i9dQZF1DWZeKCadgRdKQ';

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            const element = document.getElementById('spotify-embed-container');
            const options = { uri: currentSpotifyUri, width: '100%', height: '152' };
            const callback = (EmbedController) => {
                spotifyController = EmbedController;
                spotifyController.addListener('playback_update', e => {
                    if (loopEnabled && e.data.duration > 0 && e.data.position >= e.data.duration - 500) {
                        spotifyController.seek(0);
                    }
                });
            };
            IFrameAPI.createController(element, options, callback);
        };

        function toggleLoop() {
            loopEnabled = !loopEnabled;
            document.getElementById('loop-btn').classList.toggle('active', loopEnabled);
        }

        focusTitle.addEventListener('blur', function() { if (this.innerText.trim() === "") this.innerText = "FOCUS"; });
        focusTitle.addEventListener('focus', function() {
            if (this.innerText.trim() === "FOCUS" || this.innerText.trim() === "STUDY") {
                const range = document.createRange(); range.selectNodeContents(this);
                const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
            }
        });

        renderCustomPresets();

        document.querySelectorAll('.time-part[contenteditable="true"]').forEach(part => {
            part.addEventListener('keydown', function(e) {
                const allowedKeys = ['Backspace', 'Tab', 'ArrowLeft', 'ArrowRight', 'Delete'];
                if (allowedKeys.includes(e.key)) return;
                if (!/^[0-9]$/.test(e.key) || this.innerText.length >= 2) e.preventDefault();
            });
            part.addEventListener('paste', function(e) {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                document.execCommand('insertText', false, text.replace(/[^0-9]/g, '').slice(0, 2));
            });
            part.addEventListener('blur', function() {
                if (this.innerText === '') this.innerText = '00';
                else if (this.innerText.length === 1) this.innerText = '0' + this.innerText;
            });
        });

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleMusicPanel() { musicPanel.style.display = musicPanel.style.display === 'flex' ? 'none' : 'flex'; }
        function loadSpotify() {
            const url = document.getElementById('spotify-link').value;
            if (!url.includes('spotify.com')) return alert("Please enter a valid Spotify link.");
            const match = url.match(/spotify\.com\/(track|album|playlist|episode|show)\/([a-zA-Z0-9]+)/);
            if (!match) return alert("Couldn't parse that Spotify link.");
            currentSpotifyUri = `spotify:${match[1]}:${match[2]}`;
            if (spotifyController) spotifyController.loadUri(currentSpotifyUri);
            document.getElementById('spotify-link').value = '';
        }

        // --- Custom Presets Logic ---
        function addCustomPreset() {
            const sVal = parseInt(document.getElementById('custom-s-in').value);
            const bVal = parseInt(document.getElementById('custom-b-in').value);
            if (!sVal || !bVal) { alert("Enter both study and break minutes."); return; }
            
            customPresets.push({ study: sVal, break: bVal });
            localStorage.setItem('focus_custom_presets', JSON.stringify(customPresets));
            document.getElementById('custom-s-in').value = ''; document.getElementById('custom-b-in').value = '';
            renderCustomPresets();
        }

        function removeCustomPreset(index) {
            customPresets.splice(index, 1);
            localStorage.setItem('focus_custom_presets', JSON.stringify(customPresets));
            renderCustomPresets();
        }

        function renderCustomPresets() {
            customPresetsContainer.innerHTML = '';
            customPresets.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'preset-btn';
                div.innerHTML = `
                    <span onclick="startStudy(${p.study}, ${p.break})" style="flex: 1;">${p.study} Min Study / ${p.break} Min Break</span>
                    <button class="preset-delete" onclick="removeCustomPreset(${index})" title="Delete">×</button>
                `;
                customPresetsContainer.appendChild(div);
            });
        }

        // --- Study Stats & Calendar Logic ---
        function switchStudyTab(tab) {
            document.getElementById('tab-btn-presets').className = tab === 'presets' ? 'study-nav-btn active' : 'study-nav-btn';
            document.getElementById('tab-btn-stopwatch').className = tab === 'stopwatch' ? 'study-nav-btn active' : 'study-nav-btn';
            document.getElementById('tab-btn-stats').className = tab === 'stats' ? 'study-nav-btn active' : 'study-nav-btn';
            
            studyMainView.style.display = tab === 'presets' ? 'flex' : 'none';
            studyStopwatchView.style.display = tab === 'stopwatch' ? 'flex' : 'none';
            studyStatsView.style.display = tab === 'stats' ? 'flex' : 'none';
            
            if (tab === 'stats') {
                renderGraph();
                renderCalendar();
                renderSubjectStats();
                renderStreak();
            }
        }

        function formatStatDisplay(totalSecs) {
            if (!totalSecs) return "0m";
            const h = Math.floor(totalSecs / 3600);
            const m = Math.floor((totalSecs % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function renderGraph() {
            statsGraph.innerHTML = '';
            const today = new Date();
            let last7Days = [];
            let maxSecs = 1; 

            for (let i = 6; i >= 0; i--) {
                let d = new Date(today);
                d.setDate(today.getDate() - i);
                
                const offset = d.getTimezoneOffset() * 60000;
                const dateStr = (new Date(d - offset)).toISOString().split('T')[0]; 
                
                const dayLabel = d.toLocaleDateString('en-US', { weekday: 'short' });
                const secs = studyStats[dateStr] || 0;
                
                if (secs > maxSecs) maxSecs = secs;
                last7Days.push({ label: dayLabel, secs: secs });
            }

            last7Days.forEach(data => {
                const heightPct = (data.secs / maxSecs) * 100;
                const barGroup = document.createElement('div');
                barGroup.className = 'bar-group';
                barGroup.innerHTML = `
                    <div class="stat-total">${formatStatDisplay(data.secs)}</div>
                    <div class="bar" style="height: ${heightPct}%"></div>
                    <div class="bar-label">${data.label}</div>
                `;
                statsGraph.appendChild(barGroup);
            });
        }

        function fillMonthSelect() {
            const monthSelect = document.getElementById('month-select');
            if (monthSelect.options.length) return;
            const today = new Date();
            for (let i = 0; i < 12; i++) {
                const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
                const opt = document.createElement('option');
                opt.value = `${d.getFullYear()}-${d.getMonth()}`;
                opt.innerText = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                monthSelect.appendChild(opt);
            }
        }

        function renderCalendar() {
            fillMonthSelect();
            calendarHeatmap.innerHTML = '';
            const [year, month] = document.getElementById('month-select').value.split('-').map(Number);
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let maxSecs = 1;
            for(let key in studyStats) { if(studyStats[key] > maxSecs) maxSecs = studyStats[key]; }

            // Blank cells so day 1 lands on the right weekday
            for (let i = 0; i < new Date(year, month, 1).getDay(); i++) {
                const blank = document.createElement('div');
                blank.className = 'day-cell empty';
                calendarHeatmap.appendChild(blank);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const secs = studyStats[dateStr] || 0;
                
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerText = day;
                cell.title = `${dateStr}: ${formatStatDisplay(secs)}`;
                
                if(secs > 0) {
                    const pct = secs / maxSecs;
                    if(pct > 0.6) cell.classList.add('lvl-3');
                    else if(pct > 0.3) cell.classList.add('lvl-2');
                    else cell.classList.add('lvl-1');
                }
                
                calendarHeatmap.appendChild(cell);
            }
        }

        // --- Study Presets Logic ---
        function startStudy(studyM, breakM) {
            initAudio();
            pendingBreakMins = breakM;
            currentStudySecs = studyM * 60;
            studyState = 'study';
            studyPaused = false;
            
            if (mode === 'study') focusTitle.innerText = "STUDYING";
            studyNav.style.display = 'none'; 
            studyPresets.style.display = 'none';
            studyTimerDisplay.style.display = 'flex';
            studyCancelBtn.style.display = 'block';
            studyPauseBtn.style.display = 'block';
            studyPauseBtn.innerText = '⏸';
            updateStudyDisplay();
        }

        function startBreak() {
            currentStudySecs = pendingBreakMins * 60;
            studyState = 'break';
            studyPaused = false;
            studyPauseBtn.innerText = '⏸';
            if (mode === 'study') focusTitle.innerText = "BREAK TIME";
            updateStudyDisplay();
        }

        function toggleStudyPause() {
            if (studyState !== 'study' && studyState !== 'break') return;
            studyPaused = !studyPaused;
            studyPauseBtn.innerText = studyPaused ? '▶' : '⏸';
            if (mode === 'study' && studyPaused) focusTitle.innerText = "PAUSED";
            else if (mode === 'study') focusTitle.innerText = studyState === 'study' ? "STUDYING" : "BREAK TIME";
        }

        function cancelStudy() {
            studyState = 'idle';
            pomodoroPlan = null;
            studyPaused = false;
            studyNav.style.display = 'flex';
            studyPresets.style.display = 'flex';
            studyTimerDisplay.style.display = 'none';
            studyCancelBtn.style.display = 'none';
            studyPauseBtn.style.display = 'none';
            if (mode === 'study') focusTitle.innerText = "STUDY PRESETS";
        }

        function updateStudyDisplay() {
            let h = Math.floor(currentStudySecs / 3600);
            let m = Math.floor((currentStudySecs % 3600) / 60);
            let s = currentStudySecs % 60;
            document.getElementById('st-hours').innerText = String(h).padStart(2, '0');
            document.getElementById('st-minutes').innerText = String(m).padStart(2, '0');
            document.getElementById('st-seconds').innerText = String(s).padStart(2, '0');
        }

        // --- Planner Logic ---
        function dateKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function currentWeek() {
            const today = new Date();
            const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay() + 6) % 7));
            return Array.from({ length: 7 }, (_, i) => new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
        }

        function savePlans() { localStorage.setItem('focus_planner', JSON.stringify(plans)); }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function formatHours(secs) {
            const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
            return h ? `${h}h ${m}m` : `${m}m`;
        }

        function selectPlanDay(day) { selectedPlanDay = day; deckIndex = 0; pomoChooser = null; renderPlanner(); }

        // Lay the cards out as a stack: top card, two peeking behind, the rest hidden
        function updateDeck() {
            const cards = planCarousel.querySelectorAll('.plan-card');
            const n = cards.length;
            if (n) deckIndex = ((deckIndex % n) + n) % n;
            cards.forEach((c, i) => {
                const pos = (i - deckIndex + n) % n;
                c.dataset.pos = pos <= 2 ? pos : 'hidden';
            });
            document.getElementById('deck-nav').style.display = n > 1 ? 'flex' : 'none';
            document.getElementById('deck-count').innerText = `${deckIndex + 1} / ${n}`;
        }

        function flipDeck(dir) {
            if (pomoChooser !== null) { pomoChooser = null; renderPlanner(); }
            deckIndex += dir;
            updateDeck();
        }

        function renderPlanner() {
            renderExams();
            const todayKey = dateKey(new Date());
            const week = currentWeek();
            if (!selectedPlanDay) selectedPlanDay = todayKey;

            document.getElementById('day-strip').innerHTML = week.map(d => {
                const key = dateKey(d);
                const cls = ['day-btn', key === todayKey ? 'today' : '', key === selectedPlanDay ? 'active' : ''].join(' ');
                return `<button class="${cls}" onclick="selectPlanDay('${key}')">${d.toLocaleDateString('en-US', { weekday: 'short' })}<small>${d.getDate()}</small></button>`;
            }).join('');

            const list = plans[selectedPlanDay] || [];
            planCarousel.innerHTML = list.length ? list.map((p, i) => {
                const running = [activePlan, studyState !== 'idle' && pomodoroPlan].some(a => a && a.day === selectedPlanDay && a.index === i);
                const pct = Math.min(100, (p.secs / (p.goal * 3600)) * 100);
                const lastNote = (p.notes || []).slice(-1)[0];
                return `<div class="plan-card ${running ? 'running' : ''}">
                    <button class="plan-delete" onclick="deletePlan(${i})">×</button>
                    <div class="plan-subject">${escapeHtml(p.subject)}</div>
                    <div class="plan-item">${escapeHtml(p.item)}</div>
                    ${lastNote ? `<div class="plan-note-last">📝 ${escapeHtml(lastNote.text)}${p.notes.length > 1 ? ` (+${p.notes.length - 1} more)` : ''}</div>` : ''}
                    <div class="plan-progress"><div style="width: ${pct}%"></div></div>
                    <div class="plan-meta">
                        <span id="plan-time-${i}">${formatHours(p.secs)} / ${p.goal}h</span>
                        <span class="plan-actions">
                            <button class="btn-icon plan-pomo" onclick="togglePomoChooser(${i})" title="Start a study preset">🍅</button>
                            <button class="btn-icon plan-play" onclick="togglePlan(${i})" title="Free study">${running && !(studyState !== 'idle' && studyPaused && pomodoroPlan && pomodoroPlan.index === i) ? '⏸' : '▶'}</button>
                        </span>
                    </div>
                    ${pomoChooser === i ? `<div class="pomo-choices">${pomoOptions().map(o => `<button onclick="startPlanPomodoro(${i}, ${o.study}, ${o.break})">${o.study}/${o.break}</button>`).join('')}</div>` : ''}
                    <input class="plan-note" placeholder="Session note… (Enter to save)" maxlength="80" onkeydown="if (event.key === 'Enter') addPlanNote(${i}, this)">
                </div>`;
            }).join('') : '<div class="plan-empty">No subjects planned for this day yet.</div>';
            updateDeck();

            let planned = 0, done = 0;
            week.forEach(d => (plans[dateKey(d)] || []).forEach(p => { planned += p.goal * 3600; done += p.secs; }));
            document.getElementById('plan-week').innerText = `THIS WEEK: ${formatHours(done)} / ${formatHours(planned)}`;
        }

        function addPlan() {
            const subject = document.getElementById('plan-subject').value.trim();
            const goal = parseFloat(document.getElementById('plan-hours').value);
            const item = document.getElementById('plan-item').value.trim();
            if (!subject || !(goal > 0)) return;
            (plans[selectedPlanDay] = plans[selectedPlanDay] || []).push({ subject, item, goal, secs: 0 });
            savePlans();
            ['plan-subject', 'plan-hours', 'plan-item'].forEach(id => document.getElementById(id).value = '');
            deckIndex = plans[selectedPlanDay].length - 1;
            renderPlanner();
        }

        function deletePlan(index) {
            if (activePlan && activePlan.day === selectedPlanDay) {
                if (activePlan.index === index) activePlan = null;
                else if (activePlan.index > index) activePlan.index--;
            }
            if (pomodoroPlan && pomodoroPlan.day === selectedPlanDay) {
                if (pomodoroPlan.index === index) pomodoroPlan = null;
                else if (pomodoroPlan.index > index) pomodoroPlan.index--;
            }
            pomoChooser = null;
            plans[selectedPlanDay].splice(index, 1);
            if (deckIndex >= index && deckIndex > 0) deckIndex--;
            savePlans();
            renderPlanner();
        }

        function togglePlan(index) {
            if (studyState !== 'idle' && pomodoroPlan && pomodoroPlan.day === selectedPlanDay && pomodoroPlan.index === index) {
                toggleStudyPause();
                renderPlanner();
                return;
            }
            const same = activePlan && activePlan.day === selectedPlanDay && activePlan.index === index;
            activePlan = same ? null : { day: selectedPlanDay, index };
            if (activePlan && studyState !== 'idle') cancelStudy(); // don't count the same time twice
            savePlans();
            localStorage.setItem('focus_subject_stats', JSON.stringify(subjectStats));
            renderPlanner();
        }

        function pomoOptions() {
            return [{ study: 25, break: 5 }, { study: 50, break: 10 }, ...customPresets];
        }

        function togglePomoChooser(index) {
            pomoChooser = pomoChooser === index ? null : index;
            renderPlanner();
        }

        function startPlanPomodoro(index, studyM, breakM) {
            activePlan = null;
            pomoChooser = null;
            pomodoroPlan = { day: selectedPlanDay, index };
            document.getElementById('mode-select').value = 'study';
            changeMode();
            switchStudyTab('presets');
            startStudy(studyM, breakM);
        }

        function addPlanNote(index, input) {
            const text = input.value.trim();
            if (!text) return;
            const p = plans[selectedPlanDay][index];
            (p.notes = p.notes || []).push({ text, at: Date.now() });
            savePlans();
            renderPlanner();
        }

        // Adds one second of study to a planner card and its subject total
        function creditPlan(ref, now) {
            const p = ref && (plans[ref.day] || [])[ref.index];
            if (!p) return false;
            p.secs++;
            subjectStats[p.subject] = (subjectStats[p.subject] || 0) + 1;
            if (now.getSeconds() % 5 === 0) {
                savePlans();
                localStorage.setItem('focus_subject_stats', JSON.stringify(subjectStats));
            }
            if (mode === 'planner' && selectedPlanDay === ref.day) {
                const label = document.getElementById(`plan-time-${ref.index}`);
                if (label) {
                    label.innerText = `${formatHours(p.secs)} / ${p.goal}h`;
                    label.closest('.plan-card').querySelector('.plan-progress div').style.width = `${Math.min(100, (p.secs / (p.goal * 3600)) * 100)}%`;
                }
            }
            return true;
        }

        // --- Exam countdown ---
        function daysUntil(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const now = new Date();
            return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
        }

        function renderExams() {
            const upcoming = exams.map((e, i) => ({ ...e, i, days: daysUntil(e.date) })).filter(e => e.days >= 0).sort((a, b) => a.days - b.days);
            document.getElementById('exam-row').innerHTML = upcoming.map(e => `
                <div class="exam-chip ${e.days <= 7 ? 'soon' : ''}">
                    <span>${escapeHtml(e.name)}</span>
                    <span class="days">${e.days === 0 ? 'Today!' : e.days === 1 ? '1 day' : e.days + ' days'}</span>
                    <button onclick="deleteExam(${e.i})" title="Remove">×</button>
                </div>`).join('') + `
                <div class="exam-form">
                    <input type="text" id="exam-name" placeholder="Exam (e.g. SAT)" maxlength="20">
                    <input type="date" id="exam-date">
                    <button onclick="addExam()" title="Add exam">+</button>
                </div>`;
        }

        function addExam() {
            const name = document.getElementById('exam-name').value.trim();
            const date = document.getElementById('exam-date').value;
            if (!name || !date) return;
            exams.push({ name, date });
            localStorage.setItem('focus_exams', JSON.stringify(exams));
            renderExams();
        }

        function deleteExam(index) {
            exams.splice(index, 1);
            localStorage.setItem('focus_exams', JSON.stringify(exams));
            renderExams();
        }

        // --- Distraction counter ---
        function isStudying() {
            return studyState === 'study' && !studyPaused || isStudyStopwatchRunning || !!activePlan;
        }

        function logDistraction() {
            const key = dateKey(new Date());
            distractions[key] = (distractions[key] || 0) + 1;
            localStorage.setItem('focus_distractions', JSON.stringify(distractions));
            const b = document.getElementById('distract-btn');
            b.innerText = `😵 Distracted (${distractions[key]} today)`;
        }

        // --- Notifications ---
        function applyNotifyToggle() {
            const on = localStorage.getItem('focus_notify') === '1' && 'Notification' in window && Notification.permission === 'granted';
            const toggle = document.getElementById('notify-toggle');
            toggle.className = on ? 'toggle-btn on' : 'toggle-btn off';
            toggle.innerText = on ? 'ON' : 'OFF';
            return on;
        }

        async function toggleNotifications() {
            if (!('Notification' in window)) { alert('Notifications are not supported here. On iPad, add the app to your Home Screen first.'); return; }
            if (localStorage.getItem('focus_notify') === '1') {
                localStorage.setItem('focus_notify', '0');
            } else {
                const perm = await Notification.requestPermission();
                if (perm !== 'granted') alert('Notifications are blocked. Allow them in your browser settings.');
                localStorage.setItem('focus_notify', perm === 'granted' ? '1' : '0');
            }
            applyNotifyToggle();
        }

        function sendNotification(text) {
            if (!applyNotifyToggle()) return;
            const opts = { body: text, icon: 'icons/icon-192.png', tag: 'focus-alarm' };
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                navigator.serviceWorker.ready.then(reg => reg.showNotification('focus', opts));
            } else {
                try { new Notification('focus', opts); } catch (e) { console.log(e); }
            }
        }

        // --- Cloud sync hook: reload in-memory state after another device changes data ---
        function reloadFocusState() {
            customPresets = JSON.parse(localStorage.getItem('focus_custom_presets')) || [];
            studyStats = JSON.parse(localStorage.getItem('focus_study_stats')) || {};
            plans = JSON.parse(localStorage.getItem('focus_planner')) || {};
            subjectStats = JSON.parse(localStorage.getItem('focus_subject_stats')) || {};
            exams = JSON.parse(localStorage.getItem('focus_exams')) || [];
            distractions = JSON.parse(localStorage.getItem('focus_distractions')) || {};
            dailyGoal = parseFloat(localStorage.getItem('focus_daily_goal')) || 2;
            modeOrder = (JSON.parse(localStorage.getItem('focus_mode_order')) || []).filter(m => modeLabels[m]);
            Object.keys(modeLabels).forEach(m => { if (!modeOrder.includes(m)) modeOrder.push(m); });
            if (activePlan && !(plans[activePlan.day] || [])[activePlan.index]) activePlan = null;
            if (pomodoroPlan && !(plans[pomodoroPlan.day] || [])[pomodoroPlan.index]) pomodoroPlan = null;

            applyDarkMode(localStorage.getItem('focus_dark_mode') === '1');
            renderModeSelect();
            renderCustomPresets();
            if (document.getElementById('settings-panel').style.display === 'flex') renderReorderList();
            if (mode === 'planner' && !plannerInterface.contains(document.activeElement)) renderPlanner();
            if (studyStatsView.style.display === 'flex') { renderGraph(); renderCalendar(); renderSubjectStats(); renderStreak(); }
        }

        // --- Backup / restore ---
        function exportData() {
            const data = {};
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.startsWith('focus_')) data[k] = localStorage.getItem(k);
            }
            savePlans(); // make sure the latest seconds are included
            data.focus_planner = localStorage.getItem('focus_planner');
            const blob = new Blob([JSON.stringify({ app: 'focus', exported: new Date().toISOString(), data }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `focus-backup-${dateKey(new Date())}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importData(input) {
            const file = input.files[0];
            input.value = '';
            if (!file) return;
            file.text().then(text => {
                let parsed;
                try { parsed = JSON.parse(text); } catch (e) { alert('That file is not a valid backup.'); return; }
                if (!parsed || parsed.app !== 'focus' || typeof parsed.data !== 'object') { alert('That file is not a focus backup.'); return; }
                if (!confirm('Replace all current data with this backup?')) return;
                Object.keys(localStorage).filter(k => k.startsWith('focus_')).forEach(k => localStorage.removeItem(k));
                Object.entries(parsed.data).forEach(([k, v]) => { if (k.startsWith('focus_') && typeof v === 'string') localStorage.setItem(k, v); });
                location.reload();
            });
        }

        // --- Daily goal & streak ---
        function setDailyGoal(val) {
            const v = parseFloat(val);
            if (!(v > 0)) { document.getElementById('daily-goal').value = dailyGoal; return; }
            dailyGoal = v;
            localStorage.setItem('focus_daily_goal', String(v));
            renderStreak();
        }

        function renderStreak() {
            const goalSecs = dailyGoal * 3600;
            const today = new Date();
            const todaySecs = studyStats[dateKey(today)] || 0;
            let streak = 0;
            // Today only breaks the streak once it's over, so start from yesterday if it isn't met yet
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (todaySecs >= goalSecs ? 0 : 1));
            while ((studyStats[dateKey(d)] || 0) >= goalSecs) { streak++; d.setDate(d.getDate() - 1); }
            document.getElementById('streak-count').innerText = `🔥 ${streak}-day streak`;
            document.getElementById('streak-today').innerText = `TODAY ${formatHours(todaySecs)} / ${dailyGoal}h`;
            let weekDistract = 0;
            for (let i = 0; i < 7; i++) weekDistract += distractions[dateKey(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i))] || 0;
            const todayDistract = distractions[dateKey(today)] || 0;
            document.getElementById('distract-stats').innerText = `😵 ${todayDistract} distraction${todayDistract === 1 ? '' : 's'} today · ${weekDistract} in the last 7 days`;
            document.getElementById('streak-bar').style.width = `${Math.min(100, (todaySecs / goalSecs) * 100)}%`;
        }

        function renderSubjectStats() {
            const rows = Object.entries(subjectStats).sort((a, b) => b[1] - a[1]);
            document.getElementById('subject-stats').innerHTML = rows.length
                ? rows.map(([s, secs]) => `<div class="subject-row"><span>${escapeHtml(s)}</span><span>${formatHours(secs)}</span></div>`).join('')
                : '<div class="subject-row"><span>No planner sessions yet</span></div>';
        }

        // Scroll wheel or swipe flips through the deck
        let lastFlip = 0;
        planCarousel.addEventListener('wheel', e => {
            if (planCarousel.querySelectorAll('.plan-card').length < 2) return;
            e.preventDefault();
            const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
            if (Math.abs(delta) < 4 || Date.now() - lastFlip < 350) return;
            lastFlip = Date.now();
            flipDeck(delta > 0 ? 1 : -1);
        }, { passive: false });
        let touchX = null;
        planCarousel.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
        planCarousel.addEventListener('touchend', e => {
            if (touchX === null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            touchX = null;
            if (Math.abs(dx) > 40) flipDeck(dx < 0 ? 1 : -1);
        });

        // --- Study Stopwatch Logic ---
        function toggleStudyStopwatch() {
            isStudyStopwatchRunning = !isStudyStopwatchRunning;
            document.getElementById('ssw-toggle-btn').innerText = isStudyStopwatchRunning ? "Stop" : "Start";
            if (mode === 'study') {
                focusTitle.innerText = isStudyStopwatchRunning ? "STUDYING" : "STUDY STOPWATCH";
            }
        }

        // --- Alarms Logic ---
        function renderAlarms() {
            alarmList.innerHTML = '';
            alarms.forEach((alarm, index) => {
                let [hh, mm] = alarm.time.split(':'); let ampm = hh >= 12 ? 'PM' : 'AM'; let displayH = hh % 12 || 12;
                const div = document.createElement('div');
                div.className = `alarm-item ${alarm.active ? '' : 'inactive'}`;
                div.innerHTML = `
                    <div class="alarm-info"><span style="font-size: 1.1rem;">${displayH}:${mm} ${ampm}</span><span class="alarm-label">${alarm.label || 'Alarm'}</span></div>
                    <div class="alarm-controls"><button class="toggle-btn ${alarm.active ? 'on' : 'off'}" onclick="toggleActive(${index})">${alarm.active ? 'ON' : 'OFF'}</button><button class="alarm-btn delete" onclick="deleteAlarm(${index})" title="Delete">×</button></div>
                `;
                alarmList.appendChild(div);
            });
        }

        function addAlarm() {
            initAudio(); 
            const timeVal = document.getElementById('new-alarm-time').value;
            const labelVal = document.getElementById('new-alarm-label').value;
            if (!timeVal) { alert("Select a time!"); return; }
            if (alarms.length >= 10) { alert("Max 10 alarms."); return; }
            alarms.push({ time: timeVal, label: labelVal, active: true, triggeredToday: false });
            document.getElementById('new-alarm-time').value = '';
            document.getElementById('new-alarm-label').value = '';
            renderAlarms();
        }

        function deleteAlarm(index) { alarms.splice(index, 1); renderAlarms(); }
        function toggleActive(index) { alarms[index].active = !alarms[index].active; renderAlarms(); }

        function playBeep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); 
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function triggerAlarm(label) {
            initAudio();
            if (activeAlarmInterval) clearInterval(activeAlarmInterval);
            activeAlarmInterval = setInterval(playBeep, 200);
            ringingText.innerText = `ALARM: ${label || 'Time is up!'}`;
            ringingBox.style.display = 'flex';
            sendNotification(label || 'Time is up!');
        }

        function stopAlarm() {
            if (activeAlarmInterval) { clearInterval(activeAlarmInterval); activeAlarmInterval = null; }
            ringingBox.style.display = 'none';
            if (studyState === 'study_ringing') startBreak();
            else if (studyState === 'break_ringing') cancelStudy();
        }

        function checkAlarms(now) {
            const currentHHMM = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            const currentSec = now.getSeconds();
            if (currentSec === 0) {
                alarms.forEach(a => { if (a.active && a.time === currentHHMM && !a.triggeredToday) { triggerAlarm(a.label); a.triggeredToday = true; } });
            } else if (currentSec === 1) { alarms.forEach(a => a.triggeredToday = false); }
        }

        // --- Main Clock/Timer Update Loop ---
        // Browsers throttle timers in background tabs (down to once a minute), so instead of
        // counting interval calls we replay every wall-clock second that passed since the last run.
        let lastTickSec = Math.floor(Date.now() / 1000);
        function updateDisplay() {
            const nowSec = Math.floor(Date.now() / 1000);
            const missed = Math.min(nowSec - lastTickSec, 86400);
            lastTickSec = nowSec;
            for (let i = missed - 1; i >= 0; i--) tick(new Date((nowSec - i) * 1000));

            // Clock
            const now = new Date();
            let ch = now.getHours() % 12; ch = ch ? ch : 12; 
            document.getElementById('c-hours').innerText = String(ch).padStart(2, '0');
            document.getElementById('c-minutes').innerText = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('c-seconds').innerText = String(now.getSeconds()).padStart(2, '0');
        }

        // Advances all running timers by one second
        function tick(now) {
            checkAlarms(now);

            // Timer
            if (timerRunning) {
                let thEl = document.getElementById('t-hours'), tmEl = document.getElementById('t-minutes'), tsEl = document.getElementById('t-seconds');
                let total = (parseInt(thEl.innerText) || 0) * 3600 + (parseInt(tmEl.innerText) || 0) * 60 + (parseInt(tsEl.innerText) || 0);
                total--;
                if (total <= 0) { total = 0; timerRunning = false; if (mode === 'timer') btn.innerText = "Start"; triggerAlarm("TIMER DONE"); }
                thEl.innerText = String(Math.floor(total / 3600)).padStart(2, '0'); tmEl.innerText = String(Math.floor((total % 3600) / 60)).padStart(2, '0'); tsEl.innerText = String(total % 60).padStart(2, '0');
            }

            // Function to log study time safely
            const logStudyTime = () => {
                const offset = now.getTimezoneOffset() * 60000;
                const dateStr = (new Date(now - offset)).toISOString().split('T')[0];
                if (!studyStats[dateStr]) studyStats[dateStr] = 0;
                studyStats[dateStr]++;
                if (now.getSeconds() % 5 === 0) {
                    localStorage.setItem('focus_study_stats', JSON.stringify(studyStats));
                }
            };

            // Study Presets Background Run
            if ((studyState === 'study' || studyState === 'break') && !studyPaused) {
                if (studyState === 'study') { logStudyTime(); creditPlan(pomodoroPlan, now); }
                
                currentStudySecs--;
                if (currentStudySecs <= 0) {
                    currentStudySecs = 0;
                    if (studyState === 'study') {
                        studyState = 'study_ringing';
                        triggerAlarm("STUDY DONE. CLICK STOP FOR BREAK.");
                    } else if (studyState === 'break') {
                        studyState = 'break_ringing';
                        triggerAlarm("BREAK DONE. GET BACK TO WORK.");
                    }
                }
                updateStudyDisplay();
            }

            const distractBtn = document.getElementById('distract-btn');
            const studying = isStudying();
            if (studying && distractBtn.style.display !== 'block') distractBtn.innerText = `😵 Distracted${distractions[dateKey(now)] ? ` (${distractions[dateKey(now)]} today)` : ''}`;
            distractBtn.style.display = studying ? 'block' : 'none';

            // Planner Background Run
            if (activePlan) {
                if (creditPlan(activePlan, now)) logStudyTime();
                else activePlan = null;
            }

            // Study Stopwatch Background Run
            if (isStudyStopwatchRunning) {
                logStudyTime();
                studyStopwatchSecs++;
                
                let h = Math.floor(studyStopwatchSecs / 3600);
                let m = Math.floor((studyStopwatchSecs % 3600) / 60);
                let s = studyStopwatchSecs % 60;
                document.getElementById('ssw-hours').innerText = String(h).padStart(2, '0');
                document.getElementById('ssw-minutes').innerText = String(m).padStart(2, '0');
                document.getElementById('ssw-seconds').innerText = String(s).padStart(2, '0');
            }
        }

        function toggle() {
            initAudio(); 
            if (mode === 'timer') {
                timerRunning = !timerRunning; btn.innerText = timerRunning ? "Stop" : "Start";
                document.getElementById('t-hours').contentEditable = !timerRunning; document.getElementById('t-minutes').contentEditable = !timerRunning; document.getElementById('t-seconds').contentEditable = !timerRunning;
            }
        }

        function resetTime() {
            if (mode === 'timer') {
                timerRunning = false; btn.innerText = "Start";
                document.getElementById('t-hours').innerText = "02"; document.getElementById('t-minutes').innerText = "00"; document.getElementById('t-seconds').innerText = "00";
                document.getElementById('t-hours').contentEditable = true; document.getElementById('t-minutes').contentEditable = true; document.getElementById('t-seconds').contentEditable = true;
            }
        }

        function changeMode() {
            mode = document.getElementById('mode-select').value;
            
            const isClock = mode === 'clock', isAlarm = mode === 'alarm', isTimer = mode === 'timer', isStudy = mode === 'study', isPlanner = mode === 'planner';
            
            timerDisplay.style.display = isTimer ? 'flex' : 'none';
            clockDisplay.style.display = isClock ? 'flex' : 'none'; 
            alarmInterface.style.display = isAlarm ? 'flex' : 'none';
            studyInterface.style.display = isStudy ? 'flex' : 'none';
            plannerInterface.style.display = isPlanner ? 'flex' : 'none';
            if (isPlanner) renderPlanner();
            
            if (isStudy) {
                if (studyState === 'idle') {
                    studyNav.style.display = 'flex';
                } else {
                    studyNav.style.display = 'none';
