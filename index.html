                    studyMainView.style.display = 'flex';
                    studyStopwatchView.style.display = 'none';
                    studyStatsView.style.display = 'none';
                }
                studyTimerDisplay.style.display = (studyState !== 'idle') ? 'flex' : 'none';
            } else {
                studyTimerDisplay.style.display = 'none';
            }

            btn.style.display = (isClock || isAlarm || isStudy || isPlanner) ? 'none' : 'inline-block';
            resetBtn.style.display = (isClock || isAlarm || isStudy || isPlanner) ? 'none' : 'inline-block';

            if (isTimer) btn.innerText = timerRunning ? "Stop" : "Start";

            if (isAlarm) {
                if (!['ALARMS', 'CLOCK', 'STUDY PRESETS', 'STUDY STOPWATCH', 'STUDYING', 'BREAK TIME', 'PLANNER'].includes(focusTitle.innerText)) focusTitle.dataset.savedText = focusTitle.innerText;
                focusTitle.innerText = "ALARMS"; focusTitle.contentEditable = false;
            } else if (isClock) {
                if (!['ALARMS', 'CLOCK', 'STUDY PRESETS', 'STUDY STOPWATCH', 'STUDYING', 'BREAK TIME', 'PLANNER'].includes(focusTitle.innerText)) focusTitle.dataset.savedText = focusTitle.innerText;
                focusTitle.innerText = "CLOCK"; focusTitle.contentEditable = false;
            } else if (isStudy) {
                if (!['ALARMS', 'CLOCK', 'STUDY PRESETS', 'STUDY STOPWATCH', 'STUDYING', 'BREAK TIME', 'PLANNER'].includes(focusTitle.innerText)) focusTitle.dataset.savedText = focusTitle.innerText;
                if (studyState === 'idle') {
                    focusTitle.innerText = isStudyStopwatchRunning ? "STUDYING" : "STUDY PRESETS";
                }
                else if (studyState === 'study' || studyState === 'study_ringing') focusTitle.innerText = "STUDYING";
                else focusTitle.innerText = "BREAK TIME";
                focusTitle.contentEditable = false;
            } else if (isPlanner) {
                if (!['ALARMS', 'CLOCK', 'STUDY PRESETS', 'STUDY STOPWATCH', 'STUDYING', 'BREAK TIME', 'PLANNER'].includes(focusTitle.innerText)) focusTitle.dataset.savedText = focusTitle.innerText;
                focusTitle.innerText = "PLANNER"; focusTitle.contentEditable = false;
            } else {
                focusTitle.innerText = focusTitle.dataset.savedText || "STUDY"; focusTitle.contentEditable = true;
            }

            updateDisplay(); 
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        setInterval(updateDisplay, 250);

        // Offline / install support (needs https or localhost)
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>

    <!-- Cloud sync (Firebase); see SYNC_SETUP.md -->
    <script type="module">
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAf8T4DJRCUwPL8i6jR_pe2Um11uhXXL3g",
            authDomain: "focus-clock-88211.firebaseapp.com",
            projectId: "focus-clock-88211",
            storageBucket: "focus-clock-88211.firebasestorage.app",
            messagingSenderId: "139706684700",
            appId: "1:139706684700:web:733ab445a54d9d6c3d16d9"
        };

        const box = document.getElementById('sync-box');
        const LOCAL_ONLY = ['focus_notify']; // per-device settings that should not sync
        const isSynced = k => k && k.startsWith('focus_') && !LOCAL_ONLY.includes(k);

        function setBox(html) { box.innerHTML = html; }

        if (!FIREBASE_CONFIG) {
            setBox('<div class="sync-status">Sync isn\'t set up yet. See SYNC_SETUP.md in the project.</div>');
        } else {
            startSync().catch(err => {
                console.log(err);
                setBox('<div class="sync-status">Sync is offline right now. Your data is still saved on this device.</div>');
            });
        }

        async function startSync() {
            const V = '10.12.2';
            const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
            const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, setPersistence, browserLocalPersistence } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
            const { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

            const app = initializeApp(FIREBASE_CONFIG);
            const auth = getAuth(app);
            const db = getFirestore(app);
            await setPersistence(auth, browserLocalPersistence);

            let userRef = null, unsubscribe = null, applyingRemote = false, pushTimer = null;
            const dirty = new Set();

            // Watch local saves and push them (batched every few seconds)
            const origSet = localStorage.setItem.bind(localStorage);
            const origRemove = localStorage.removeItem.bind(localStorage);
            localStorage.setItem = (k, v) => { origSet(k, v); if (!applyingRemote && isSynced(k)) queuePush(k); };
            localStorage.removeItem = k => { origRemove(k); if (!applyingRemote && isSynced(k)) queuePush(k); };

            function queuePush(k) {
                if (!userRef) return;
                dirty.add(k);
                clearTimeout(pushTimer);
                pushTimer = setTimeout(pushDirty, 3000);
            }

            async function pushDirty() {
                if (!userRef || !dirty.size) return;
                const data = {};
                dirty.forEach(k => { data[k] = localStorage.getItem(k); });
                dirty.clear();
                try {
                    await setDoc(userRef, { data, updated: serverTimestamp() }, { merge: true });
                } catch (e) { console.log(e); Object.keys(data).forEach(k => dirty.add(k)); }
            }
            window.addEventListener('pagehide', pushDirty);
            document.addEventListener('visibilitychange', () => { if (document.hidden) pushDirty(); });

            function localData() {
                const data = {};
                Object.keys(localStorage).filter(isSynced).forEach(k => { data[k] = localStorage.getItem(k); });
                return data;
            }

            function applyRemote(data) {
                let changed = false;
                applyingRemote = true;
                Object.entries(data || {}).forEach(([k, v]) => {
                    if (!isSynced(k) || dirty.has(k)) return; // a local change is about to be sent; keep it
                    if (v === null) { if (localStorage.getItem(k) !== null) { localStorage.removeItem(k); changed = true; } }
                    else if (localStorage.getItem(k) !== v) { localStorage.setItem(k, v); changed = true; }
                });
                applyingRemote = false;
                if (changed) reloadFocusState();
            }

            async function connect(user) {
                userRef = doc(db, 'users', user.uid);
                const snap = await getDoc(userRef);
                const remote = (snap.exists() && snap.data().data) || {};
                const local = localData();
                const hasRemote = Object.keys(remote).length > 0;
                const differs = Object.keys(local).some(k => remote[k] !== local[k]);

                if (!hasRemote) {
                    await setDoc(userRef, { data: local, updated: serverTimestamp() });
                } else if (Object.keys(local).length && differs && !confirm('Your account already has synced data.\n\nOK = use the synced data on this device\nCancel = replace the synced data with this device\'s data')) {
                    const replace = { ...local };
                    Object.keys(remote).forEach(k => { if (!(k in replace)) replace[k] = null; });
                    await setDoc(userRef, { data: replace, updated: serverTimestamp() });
                } else {
                    applyRemote(remote);
                }

                unsubscribe = onSnapshot(userRef, s => {
                    if (s.metadata.hasPendingWrites || !s.exists()) return;
                    applyRemote(s.data().data);
                });
            }

            function showSignedOut(msg = '') {
                setBox(`
                    <div class="sync-btns"><button class="settings-btn" id="sync-google">Sign in with Google</button></div>
                    <div class="sync-status">${msg || 'Sign in with the same Google account on each device to keep them in sync.'}</div>`);
                document.getElementById('sync-google').onclick = async () => {
                    box.querySelector('.sync-status').innerText = 'Connecting…';
                    const provider = new GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    try {
                        await signInWithPopup(auth, provider);
                    } catch (e) {
                        const c = (e && e.code) || '';
                        // Pop-ups don't work in some places (e.g. iPad home-screen apps); fall back to a full-page sign-in
                        if (c.includes('popup-blocked') || c.includes('operation-not-supported')) return signInWithRedirect(auth, provider);
                        if (c.includes('popup-closed') || c.includes('cancelled-popup')) return showSignedOut();
                        if (c.includes('unauthorized-domain')) return showSignedOut('This web address isn\'t on Firebase\'s Authorized domains list.');
                        if (c.includes('operation-not-allowed')) return showSignedOut('Google sign-in isn\'t turned on in Firebase yet.');
                        if (c.includes('network')) return showSignedOut('No internet connection.');
                        showSignedOut('Couldn\'t sign in. ' + (e.message || ''));
                    }
                };
            }

            function showSignedIn(user) {
                setBox(`
                    <div class="sync-status">✅ Synced as ${(user.email || user.displayName || 'you').replace(/[<>&]/g, '')}</div>
                    <div class="sync-btns"><button class="settings-btn" id="sync-out">Sign out</button></div>`);
                document.getElementById('sync-out').onclick = async () => { await pushDirty(); signOut(auth); };
            }

            onAuthStateChanged(auth, async user => {
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                userRef = null;
                if (!user) { showSignedOut(); return; }
                try { await connect(user); showSignedIn(user); }
                catch (e) { console.log(e); showSignedOut('Couldn\'t load your synced data. Check the Firestore setup.'); }
            });
        }
    </script>
